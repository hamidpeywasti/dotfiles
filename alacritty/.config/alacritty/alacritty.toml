[window]
opacity = 0.9
blur = true
#decorations= "Full"
decorations_theme_variant = "Dark"

[font]
size = 12
normal.family = "FiraCode Nerd Font"


[terminal]

[terminal.shell]
program = "/usr/bin/zsh"
args = ["-l"]

[cursor.style]
shape = "Beam"
blinking = "On"  # Options: "Never", "Off", "On", "Always"

[cursor]
blink_interval = 750        # milliseconds
blink_timeout = 0           # 0 = never stop blinking
unfocused_hollow = true     # Hollow when unfocused
